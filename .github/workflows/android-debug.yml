name: Build Igrolov Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Using repository Android sources"
          else
            mkdir -p project
            unzip -q Igrolov_v1.0.3_GitHub_Actions_source.zip -d project
          fi
      - name: Verify 1.0.4 version metadata
        run: |
          grep -F 'versionName = "1.0.4"' app/build.gradle.kts
          grep -F 'Text("Игролов 1.0.4"' app/src/main/java/ru/igrolov/app/MainActivity.kt
      - name: Restore pinned debug signing key
        run: |
          mkdir -p signing
          base64 --decode signing/igrolov-debug.jks.base64 > signing/igrolov-debug.jks
          keytool -list -keystore signing/igrolov-debug.jks -storepass android -alias igrolov-debug > /dev/null
      - name: Build Debug APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle --no-daemon :app:assembleDebug
          else
            cd project
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-v1.0.4-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
