name: Build Igrolov Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: 1.0.8

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Using repository Android sources"
          else
            mkdir -p project
            unzip -q Igrolov_v1.0.3_GitHub_Actions_source.zip -d project
          fi
      - name: Verify version metadata
        run: |
          grep -F "versionName = \"$APP_VERSION\"" app/build.gradle.kts
          grep -F "Text(\"Игролов $APP_VERSION\"" app/src/main/java/ru/igrolov/app/MainActivity.kt
      - name: Restore pinned debug signing key
        run: |
          mkdir -p signing
          base64 --decode signing/igrolov-debug.jks.base64 > signing/igrolov-debug.jks
          keytool -list -keystore signing/igrolov-debug.jks -storepass android -alias igrolov-debug > /dev/null
      - name: Test seller category classification
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-unit-tests-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
      - name: Build Debug APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle --no-daemon :app:assembleDebug
          else
            cd project
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-v${{ env.APP_VERSION }}-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-instrumentation-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/*.apk

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Igrolov-v${{ env.APP_VERSION }}-debug-${{ github.sha }}
          path: current
      - uses: actions/download-artifact@v4
        with:
          name: Igrolov-instrumentation-${{ github.sha }}
          path: tests
      - name: Download pinned baseline APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12242854752/zip" > baseline.zip; then
            mkdir -p baseline
            unzip -q baseline.zip -d baseline
          else
            gh release download v1.0.4.1 --repo "$GITHUB_REPOSITORY" --pattern Igrolov-1.0.4.1.apk -D baseline
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, upgrade without data loss, and exercise UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/device_smoke_104.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-device-tests-api${{ matrix.api-level }}-${{ github.sha }}
          path: device-results/
          if-no-files-found: error

