name: Build Igrolov Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack project source
        run: |
          unzip -q Igrolov_v1.0.3_GitHub_Actions_source.zip -d project
      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Igrolov-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
