name: Publish Steam capsule artwork fix APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-parent-artwork-test.yml

permissions:
  actions: read
  contents: write

jobs:
  publish-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Igrolov-v1.6.2-debug-6571d1fae7a141ccbea5e7ac44374f66da6cc73a
          run-id: 40459594752
          github-token: ${{ github.token }}
          path: downloaded

      - name: Prepare APK
        run: |
          apk=$(find downloaded -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p release
          cp "$apk" release/Igrolov-1.6.2-capsule-fix-test.apk

      - name: Publish test prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2-capsule-fix-test
          target_commitish: 6571d1fae7a141ccbea5e7ac44374f66da6cc73a
          name: Игролов — исправление фильтра вертикальных обложек
          prerelease: true
          body: |
            Исправлен фильтр вертикальных обложек: ссылки library_capsule.jpg и library_capsule_2x.jpg, возвращаемые Steam StoreBrowse, больше не отбрасываются.
            Проверены реальные JPEG-постеры 300×450 для AppID 4435490, 3259780, 4078430 и 1867240. Регрессионный тест проверяет реальные имена файлов через фильтр карточек.
            
            APK собран из commit 6571d1fae7a141ccbea5e7ac44374f66da6cc73a.
            Проверки GitHub Actions: unit-тесты, live smoke, Android API 26 и 29 — успешно.
            Это тестовая prerelease-сборка, не стабильный релиз.
          files: release/Igrolov-1.6.2-capsule-fix-test.apk
          fail_on_unmatched_files: true
